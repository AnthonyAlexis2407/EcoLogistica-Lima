name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/backend/requirements.txt pip-audit
      - name: Pruebas del backend con cobertura
        run: |
          set -o pipefail
          PYTHONPATH=src/backend python -m pytest src/backend/tests --cov=src/backend/app --cov-config=.coveragerc --cov-report=xml:src/backend/coverage.xml --cov-fail-under=80 -q 2>&1 | tee pytest.log || { echo "::error title=pytest::$(grep -E 'FAILED|ERROR|Error|assert|fail-under|TOTAL' pytest.log | head -12 | paste -sd'|' | cut -c1-900)"; exit 1; }
      - run: pip-audit -r src/backend/requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
