# Integración continua (CI): calidad del código, análisis estático, compilación y validación de dependencias.
# Las pruebas (unitarias, de integración y E2E) viven en tests.yml; el despliegue, en deploy-production.yml.
# Guía: "guía_github_actions" (permisos mínimos, versiones fijas, caché de dependencias).
name: CI

on:
  push:
    branches: [main, develop, "fix/**", "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Principio de mínimo privilegio: el token solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint y Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: src/frontend

      - name: Lint del frontend (ESLint)
        run: npm run lint
        working-directory: src/frontend

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint del backend (Ruff)
        run: |
          pip install ruff
          ruff check src/backend scripts

  static-analysis:
    name: Análisis estático (tipos y seguridad)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: src/frontend

      - name: Verificar tipos de TypeScript (aplicación y pruebas E2E)
        run: npm run typecheck
        working-directory: src/frontend

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Análisis de seguridad del backend (Bandit)
        run: |
          pip install bandit
          bandit -c pyproject.toml -r src/backend/app -q

  build:
    name: Compilación (frontend y backend)
    runs-on: ubuntu-latest
    needs: [lint, static-analysis]
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Compilar el frontend
        run: |
          npm ci
          npm run build
        working-directory: src/frontend

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar y compilar el backend (importa la aplicación y compila los módulos)
        run: |
          pip install -r src/backend/requirements.txt
          python -m compileall -q src/backend/app
          PYTHONPATH=src/backend python -c "from app.main import app; print('Backend OK:', app.title)"

      - name: Construir la imagen de producción (Docker)
        run: docker build -t ecologistica-lima:ci .

  dependencias:
    name: Validación de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Comprobar la coherencia de las dependencias instaladas (pip check)
        run: |
          pip install -r src/backend/requirements.txt
          pip check

      - name: Auditar vulnerabilidades del backend (pip-audit)
        # Informativo: algunas dependencias indirectas no tienen corrección publicada; el hallazgo queda visible en el registro.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r src/backend/requirements.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Validar y auditar dependencias del frontend
        run: |
          npm ci
          npm audit --audit-level=high
        working-directory: src/frontend

  docs:
    name: Documentación (enlaces y referencias cruzadas)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar enlaces y referencias cruzadas de la documentación
        run: python scripts/verificar_enlaces.py
