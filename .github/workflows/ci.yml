# Integración continua: pruebas, cobertura, tipos, build y auditoría de dependencias.
# Guía: "guía_github_actions" (permisos mínimos, versiones fijas, caché de dependencias).
name: CI

on:
  push:
    branches: [main, develop, "fix/**", "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Principio de mínimo privilegio: el token solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r src/backend/requirements.txt pip-audit

      - name: Pruebas del backend con cobertura
        run: |
          set -o pipefail
          PYTHONPATH=src/backend python -m pytest src/backend/tests --cov=src/backend/app --cov-config=.coveragerc --cov-report=xml:src/backend/coverage.xml --cov-fail-under=80 -q 2>&1 | tee pytest.log || { echo "::error title=pytest::$(grep -E 'FAILED|ERROR|Error|assert|fail-under|TOTAL' pytest.log | head -12 | paste -sd'|' | cut -c1-900)"; exit 1; }

      - name: Auditar dependencias del backend
        run: pip-audit -r src/backend/requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Compilar
        run: npm run build

      - name: Auditar dependencias
        run: npm audit --audit-level=high

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar enlaces y referencias cruzadas de la documentación
        run: python scripts/verificar_enlaces.py
