# Despliegue automático a producción.
# Se ejecuta al publicar en main o al crear una etiqueta de versión (v1.0.0, v1.1.0, ...).
# Los datos sensibles NO están en el código: se leen de GitHub Secrets (Settings > Secrets and variables > Actions).
#   - RENDER_DEPLOY_HOOK_URL : URL secreta del "Deploy Hook" del servicio en Render (dispara el despliegue).
#   - PRODUCTION_URL         : URL pública de la aplicación desplegada (por ejemplo https://ecologistica-lima.onrender.com).
# Guía de configuración paso a paso: docs/03 Inplementación/Sprint 4/05 Guía de despliegue.md
name: Deploy Production

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; uno en curso no se cancela a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar antes de desplegar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Pruebas del backend (puerta de calidad previa al despliegue)
        run: |
          pip install -r src/backend/requirements.txt
          PYTHONPATH=src/backend python -m pytest src/backend/tests -q

      - name: Comprobar que la imagen de producción se construye
        run: docker build -t ecologistica-lima:release .

  desplegar:
    name: Desplegar a producción
    runs-on: ubuntu-latest
    needs: verificar
    # El contexto "secrets" no puede usarse en environment.url; la URL operativa se muestra en el paso de espera.
    environment: production
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Disparar el despliegue en el servidor
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error title=Falta el secreto::Defina RENDER_DEPLOY_HOOK_URL en Settings > Secrets and variables > Actions (ver la Guía de despliegue)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Despliegue solicitado para ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."

      - name: Esperar a que la aplicación responda
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error title=Falta el secreto::Defina PRODUCTION_URL con la URL pública de la aplicación."
            exit 1
          fi
          # Hasta 10 minutos: un despliegue nuevo puede tardar en arrancar.
          for i in $(seq 1 60); do
            if curl -fsS "${PRODUCTION_URL%/}/api/health" > /dev/null; then
              echo "La aplicación responde en ${PRODUCTION_URL}"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Sin respuesta::La aplicación no respondió a /api/health en 10 minutos."
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: src/frontend

      - name: Prueba de humo en producción (Playwright)
        run: npx playwright test --project=smoke
        working-directory: src/frontend
        env:
          CI: "true"
          E2E_BASE_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Guardar el informe de la prueba de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-humo-produccion
          path: src/frontend/playwright-report
          retention-days: 14
