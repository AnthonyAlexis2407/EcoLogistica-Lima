# Pruebas automáticas: unitarias, de integración y E2E (Playwright, en modo headless).
# Los informes se guardan como artefactos descargables desde la ejecución del workflow.
name: Tests

on:
  push:
    branches: [main, develop, "fix/**", "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitarias e integración)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r src/backend/requirements.txt

      - name: Pruebas con cobertura (mínimo 80 %)
        run: |
          set -o pipefail
          PYTHONPATH=src/backend python -m pytest src/backend/tests --cov=src/backend/app --cov-config=.coveragerc --cov-report=xml:src/backend/coverage.xml --cov-fail-under=80 -q -rfE 2>&1 | tee pytest.log

      - name: Resumen de las pruebas que fallaron (anotaciones)
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -15 | sed 's/%/%25/g' | cut -c1-300 | paste -sd '|' | sed 's/^/::error title=Pruebas que fallaron::/' || true
          grep -E "^E  " pytest.log | head -25 | sed 's/%/%25/g' | cut -c1-200 | paste -sd '|' | sed 's/^/::error title=Detalle del primer fallo::/' || true

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: src/backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (unitarias con Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage
          retention-days: 14

  backend-postgres:
    name: Backend sobre PostgreSQL (producción)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eco
          POSTGRES_PASSWORD: clave-solo-para-pruebas
          POSTGRES_DB: ecologistica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eco -d ecologistica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r src/backend/requirements.txt

      - name: Flujo de negocio completo contra PostgreSQL (asyncpg, timestamptz y cifrado)
        run: PYTHONPATH=src/backend python -m pytest src/backend/tests/test_postgres.py -v
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://eco:clave-solo-para-pruebas@localhost:5432/ecologistica

  failover:
    name: Conmutación por falla (RTO de 60 s)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Levantar dos instancias de la API, un balanceador y PostgreSQL
        run: docker compose -f docker-compose.failover.yml up --build -d --wait --wait-timeout 300

      - name: Medir el RTO deteniendo una instancia y luego la otra
        run: |
          python3 scripts/medir_rto.py --limite 60 --salida resultado-rto.json | tee rto.md
          { echo "### Conmutación por falla (RNF-003)"; echo; cat rto.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-rto
          path: resultado-rto.json
          retention-days: 14

      - name: Registros de las instancias si algo falló
        if: failure()
        run: docker compose -f docker-compose.failover.yml logs --tail 80

      - name: Apagar el entorno
        if: always()
        run: docker compose -f docker-compose.failover.yml down -v

  e2e:
    name: E2E con Playwright (Chromium, Firefox, WebKit y móvil)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Construir y levantar la aplicación (misma imagen que producción)
        run: |
          docker build -t ecologistica-lima:e2e .
          docker run -d --name app -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY=clave-solo-para-pruebas-e2e-no-usar-en-produccion \
            -e SEED_DEMO_DATA=true \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/e2e.db \
            ecologistica-lima:e2e
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/api/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: src/frontend

      - name: Instalar los navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: src/frontend

      - name: Ejecutar las pruebas E2E (headless)
        run: npx playwright test
        working-directory: src/frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8000

      - name: Resumen de resultados (tablas en el resumen del flujo y anotaciones)
        if: always()
        run: |
          python3 scripts/resumen_playwright.py src/frontend/test-results --anotaciones | tee resumen.md | grep '^::' || true
          grep -v '^::' resumen.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar el informe HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          retention-days: 14

      - name: Guardar resultados, métricas y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultados
          path: src/frontend/test-results
          retention-days: 14

      - name: Registros de la aplicación si algo falló
        if: failure()
        run: docker logs app
