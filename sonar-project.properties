sonar.projectKey=ecologistica-lima
sonar.projectName=EcoLogistica Lima
sonar.projectVersion=3.0.0

# Rutas relativas a la raíz del repositorio. Ejecutar el scanner desde aquí.
sonar.sources=src/backend/app,src/frontend/src
sonar.tests=src/backend/tests,src/frontend/src/__tests__
sonar.exclusions=**/__tests__/**,**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/.next/**,**/__pycache__/**,**/.venv/**,**/*.db,src/backend/app/seed.py
sonar.test.inclusions=src/backend/tests/**,src/frontend/src/__tests__/**
sonar.sourceEncoding=UTF-8

# Cobertura del backend: pytest --cov=src/backend/app --cov-report=xml:src/backend/coverage.xml
sonar.python.version=3.12
sonar.python.coverage.reportPaths=src/backend/coverage.xml

# Cobertura del frontend: npm run test:coverage (genera lcov.info)
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

# IMPORTANTE: ejecutar `python scripts/preparar_cobertura.py` antes del scanner; sin ese paso
# las rutas de los informes no coinciden con las de los archivos y Sonar muestra 0 % de cobertura.
