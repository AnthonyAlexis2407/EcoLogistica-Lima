# Plano (Blueprint) de Render para EcoLogística Lima: un único servicio Docker que sirve la API y el frontend.
# Guía paso a paso: docs/03 Inplementación/Sprint 4/05 Guía de despliegue.md
services:
  - type: web
    name: ecologistica-lima
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # El despliegue lo dispara GitHub Actions (deploy-production.yml) mediante un Deploy Hook,
    # solo cuando las pruebas pasaron; por eso se desactiva el despliegue automático de Render.
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Render genera una clave aleatoria propia; nunca se escribe en el repositorio.
      - key: SECRET_KEY
        generateValue: true
      # Carga usuarios, flota y pedidos de demostración (ver src/backend/app/seed.py).
      - key: SEED_DEMO_DATA
        value: "true"
