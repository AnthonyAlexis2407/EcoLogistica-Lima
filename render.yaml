# Plano (Blueprint) de Render para EcoLogística Lima: un único servicio Docker que sirve la API y el frontend.
# Guía paso a paso: docs/03 Inplementación/Sprint 4/05 Guía de despliegue.md
services:
  - type: web
    name: ecologistica-lima
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # El despliegue lo dispara GitHub Actions (deploy-production.yml) mediante un Deploy Hook,
    # solo cuando las pruebas pasaron; por eso se desactiva el despliegue automático de Render.
    autoDeploy: false
    # /api/health/ready comprueba la conexión a la base de datos: si falla, Render deja de enviar tráfico a la instancia.
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      # Base de datos PostgreSQL gestionada (ver `databases` abajo). La API acepta postgres:// y postgresql://.
      - key: DATABASE_URL
        fromDatabase:
          name: ecologistica-db
          property: connectionString
      # Clave propia para cifrar los datos personales en reposo (RNF-008); Render la genera y no se escribe aquí.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # Render genera una clave aleatoria propia; nunca se escribe en el repositorio.
      - key: SECRET_KEY
        generateValue: true
      # Carga usuarios, flota y pedidos de demostración (ver src/backend/app/seed.py).
      - key: SEED_DEMO_DATA
        value: "true"

# Base de datos PostgreSQL de producción (RNF-003, RNF-008). El plan gratuito de Render la elimina a los 30 días: para una
# operación real se pasa a un plan de pago (ver la guía de despliegue).
databases:
  - name: ecologistica-db
    databaseName: ecologistica
    plan: free
