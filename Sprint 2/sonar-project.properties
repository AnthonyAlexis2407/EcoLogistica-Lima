sonar.projectKey=ecologistica-lima
sonar.projectName=EcoLogistica Lima
sonar.projectVersion=2.1.0

# Rutas relativas a esta carpeta (Sprint 2). Ejecutar el scanner desde aquí.
sonar.sources=src/backend/app,src/frontend/src
sonar.tests=src/backend/tests,src/frontend/src/__tests__
sonar.exclusions=**/node_modules/**,src/frontend/src/__tests__/**,**/dist/**,**/__pycache__/**,**/.venv/**,**/*.db,src/backend/app/seed.py

# Cobertura del backend (pytest --cov=app --cov-report=xml)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=src/backend/coverage.xml

# Cobertura del frontend (npm run test:coverage)
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
