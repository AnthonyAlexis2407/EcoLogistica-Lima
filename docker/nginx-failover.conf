# Balanceador de la prueba de conmutación por falla (RNF-003).
# Una instancia que no responde se marca como caída después de un fallo y el tráfico pasa a la otra; los fallos de
# conexión se reintentan de inmediato contra la instancia sana, de modo que el cliente casi no nota la caída.
upstream api {
    server api1:8000 max_fails=1 fail_timeout=5s;
    server api2:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
